name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # package.json engines says >=22.13; 24 is the current LTS line.
        node: ["22", "24"]
    env:
      # The store tests write agent records; keep them out of $HOME on the
      # runner. The server honours this variable (README, "Development").
      CURSOR_AGENTS_STATE_ROOT: ${{ runner.temp }}/cursor-agents-mcp
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
